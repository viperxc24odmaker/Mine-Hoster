name: Build MineHoster

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Build with PyInstaller
        run: pyinstaller minehoster.spec

      - name: Verify executable
        shell: powershell
        run: |
          if (-not (Test-Path "dist/MineHoster.exe")) { throw "MineHoster.exe was not produced" }
          Write-Host "MineHoster.exe built successfully."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MineHoster-Windows
          path: dist/MineHoster.exe
